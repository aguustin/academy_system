appId: com.instituto.sistema-academico
productName: Sistema Académico
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - node_modules/**/*
extraResources:
  - from: .env
    to: .env
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
